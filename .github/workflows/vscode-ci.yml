name: Build VSCode

on:
  push:
    branches:
      - main
    paths:
      - 'srcpkgs/vscode/**'
  workflow_dispatch:

jobs:
  build:
    name: Build (VS Code) x86_64
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full
    env:
      ARCH: x86_64
      BOOTSTRAP: x86_64
      TEST: 0

    steps:
      - name: Configure mirrors
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|https://repo-default.voidlinux.org|https://repo-fastly.voidlinux.org|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -S

      - name: Install dependencies
        run: |
          xbps-install -Syu xbps && xbps-install -yu && xbps-install -y nodejs git curl base-devel bash sudo file
          
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          path: main-repo
          persist-credentials: false

      - name: Checkout void-packages
        run: |
          git clone --depth=1 https://github.com/void-linux/void-packages.git void-packages

      - name: Configure ethereal mode
        working-directory: void-packages
        run: |
          cat <<EOF > etc/conf
          XBPS_ALLOW_RESTRICTED=yes
          XBPS_ALLOW_CHROOT_BREAKOUT=yes
          XBPS_CHROOT_CMD=ethereal
          XBPS_MIRROR=https://repo-fastly.voidlinux.org/current
          EOF
          ln -s / masterdir

      - name: Merge templates
        run: |
          cp -frv main-repo/srcpkgs/vscode void-packages/srcpkgs/

      - name: Build VSCode
        working-directory: void-packages
        run: |
          /bin/bash ./xbps-src -j$(nproc) pkg vscode

      - name: Sign and Index
        working-directory: void-packages/hostdir/binpkgs/nonfree
        env:
          PRIV_KEY: ${{ secrets.PRIV_KEY }}
        run: |
          echo "$PRIV_KEY" > private.pem
          xbps-rindex -a *.xbps
          xbps-rindex -s --signedby "VoizLinux <iz@anrix.org>" --privkey private.pem $PWD
          xbps-rindex -S --privkey private.pem *.xbps
          rm private.pem

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vscode-packages
          path: void-packages/hostdir/binpkgs/*
          retention-days: 1
